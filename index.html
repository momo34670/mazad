<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAZAD — Le shopping en direct</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f5;color:#14251d;font:15px system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 15px;background:#e9eee9;color:#14251d;font-weight:700}button.primary{background:#006233;color:white}button.red{background:#d21034;color:white}button:disabled{opacity:.5;cursor:default}header{position:sticky;top:0;z-index:3;background:white;border-bottom:1px solid #e2e6e2;padding:12px 4%;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.logo{font-size:27px;font-weight:950;color:#006233;letter-spacing:-1px;cursor:pointer}header input{flex:1;min-width:130px}input,select,textarea{border:1px solid #d0d9d1;border-radius:10px;padding:12px;background:white;color:#14251d;max-width:100%}main{max-width:1180px;margin:auto;padding:22px 18px 100px}nav{position:fixed;bottom:0;left:0;right:0;z-index:4;background:white;display:flex;justify-content:center;border-top:1px solid #ddd;padding:7px 3px calc(7px + env(safe-area-inset-bottom));gap:3px}nav button{background:white;flex:1;max-width:140px;font-size:12px;padding:7px 3px}nav button.active{color:#006233;background:#e8f3ec}nav span{display:block;font-size:22px}.hero{background:linear-gradient(120deg,#003e25,#087f49);color:white;padding:28px;border-radius:24px;margin:12px 0 24px}.hero h1{font-size:clamp(27px,5vw,49px);line-height:1.05;margin:10px 0;max-width:680px}.hero p{max-width:620px}.muted{color:#63756a;font-size:13px}.hero .muted{color:#c8e8d6}.chips{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.chips button{white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px}.card{background:white;border:1px solid #e1e7e0;border-radius:18px;overflow:hidden}.pad{padding:16px}.art{height:155px;background:linear-gradient(135deg,#cdebd8,#78b79a);display:grid;place-items:center;font-size:68px;position:relative}.art.alt{background:linear-gradient(135deg,#f8e4ce,#d6b29e)}.art img{width:100%;height:100%;object-fit:cover;position:absolute}.tag{position:absolute;top:10px;left:10px;background:#d21034;color:white;border-radius:7px;padding:5px 8px;font-size:11px;font-weight:800}.heart{position:absolute;top:8px;right:8px;background:white;padding:7px 10px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.stack{display:grid;gap:12px}.two{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}.stage{height:340px;background:linear-gradient(140deg,#063d28,#0a8150);color:white;border-radius:18px;position:relative;display:grid;place-items:center;overflow:hidden}.stage .big{font-size:110px}.stage video{width:100%;height:100%;object-fit:cover}.timer{position:absolute;top:14px;right:14px;background:#18271e;padding:9px 15px;border-radius:10px;font-size:25px;font-weight:900}.chat{height:210px;overflow:auto;background:#f5f7f5;padding:10px;border-radius:10px}.chat p{margin:7px 0;overflow-wrap:anywhere}.price{font-size:28px;color:#006233;font-weight:900}.notice{padding:12px;border-radius:12px;background:#fff2d7;color:#744d00;font-size:13px}.form{display:grid;gap:10px}.form label{display:grid;gap:4px;font-size:13px;font-weight:700}.line{padding:12px 0;border-bottom:1px solid #e4e9e4}.stat{font-size:27px;font-weight:900;color:#006233}.empty{padding:25px;text-align:center;color:#65766c}.tabs{display:flex;gap:6px;flex-wrap:wrap}h1,h2,h3{margin:10px 0 14px}p{line-height:1.5}dialog{border:0;border-radius:18px;width:min(480px,94vw);max-height:85vh;overflow:auto;padding:22px}dialog::backdrop{background:#0009}#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#152c20;color:white;padding:12px 18px;border-radius:12px;z-index:10;display:none;max-width:90vw} @media(max-width:650px){.two{grid-template-columns:1fr}.stage{height:280px}header{gap:7px}header button{padding:8px}main{padding:12px 12px 100px}.art{height:135px}.hero{padding:20px}.grid{gap:9px}}
</style></head><body><header><div class="logo" onclick="go('home')">MAZAD <span lang="ar">مزاد</span></div><input id="search" placeholder="Rechercher un produit, un vendeur…" oninput="go('home')"><button onclick="go('cart')">🛍 <span id="cartCount">0</span></button><button onclick="toggleLang()" id="lang">العربية</button></header><main id="main"><section class="card pad"><h1>Bienvenue sur MAZAD</h1><p>Si ce message reste affiché, cet aperçu ne permet pas d’exécuter JavaScript. Ouvrez le site hébergé dans Safari ou Chrome pour utiliser les enchères et la navigation.</p></section></main><nav id="nav"></nav><dialog id="modal"></dialog><div id="toast"></div><script>
'use strict';const $=x=>document.getElementById(x), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=x=>Number(x).toLocaleString('fr-DZ')+' DA';const cats=['Tout','Mode','Beauté','High-tech','Maison','Collection','Artisanat'];const seed=[['Sac de soirée','Mode','👜',3500,'Dz Mode','Alger'],['Parfum oriental','Beauté','🌸',2800,'Maison Senteurs','Oran'],['Écouteurs sans fil','High-tech','🎧',4500,'Tech DZ','Sétif'],['Robot pâtissier','Maison','🍰',12000,'Cuisine DZ','Blida'],['Maillot de football','Collection','⚽',2500,'Sport DZ','Alger'],['Service à thé','Artisanat','🫖',3900,'Artisan Cirta','Constantine']].map((x,i)=>({id:i+1,name:x[0],cat:x[1],emoji:x[2],price:x[3],seller:x[4],wil:x[5],stock:5,type:i%2?'fixed':'auction',approved:true}));const defaults={products:seed,cart:[],orders:[],favorites:[],follows:[],profile:null,sellers:[],shows:[],reports:[],reviews:[],notifications:[],commission:10};let db;try{db=JSON.parse(localStorage.getItem('mazad3'))||defaults}catch{db=defaults}function save(){try{localStorage.setItem('mazad3',JSON.stringify(db))}catch{toast('Stockage local indisponible')}}let page='home',category='Tout',mode='all',lang='fr',current=1,auction=null,interval=null,messages=[],camera=null,giveaway=false,joined=false;const tr=(f,a)=>lang==='ar'?a:f;function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.display='none',3000)}function closeModal(){$('modal').close()}function modal(s){$('modal').innerHTML=s;$('modal').showModal()}function button(label,code,cls=''){return `<button class="${cls}" onclick="${code}">${label}</button>`}function notice(){return `<div class="notice">${tr('DÉMONSTRATION LOCALE — Aucun argent réel, aucun direct diffusé, comptes fictifs.','نسخة تجريبية محلية — لا دفع حقيقي ولا بث عام.')}</div>`}function go(p){if(page==='live'&&p!=='live')stopCamera();page=p;render();window.scrollTo(0,0)}function toggleLang(){lang=lang==='fr'?'ar':'fr';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('lang').textContent=lang==='fr'?'العربية':'Français';render()}function product(id){return db.products.find(p=>p.id===id)}function live(id){if(auction&&auction.running&&auction.id!==id){toast('Termine le test en cours avant de changer de produit');return}current=id;messages=[];go('live')}function fav(id){db.favorites=db.favorites.includes(id)?db.favorites.filter(x=>x!==id):[...db.favorites,id];save();render()}function follow(id){const s=product(id).seller;db.follows=db.follows.includes(s)?db.follows.filter(x=>x!==s):[...db.follows,s];save();render()}function tile(p){return `<article class="card"><div class="art ${p.id%2?'':'alt'}">${esc(p.emoji||'📦')}<span class="tag">${p.type==='auction'?'ENCHÈRES · DÉMO':'ACHAT DIRECT'}</span>${button(db.favorites.includes(p.id)?'♥':'♡',`fav(${p.id})`,'heart')}</div><div class="pad"><div class="muted">${esc(p.seller)} · ${esc(p.wil)}</div><h3>${esc(p.name)}</h3><b>${money(p.price)}</b><div class="row" style="margin-top:10px">${button('Voir',`live(${p.id})`,'primary')}${p.type==='fixed'?button('＋ Panier',`add(${p.id})`):''}</div></div></article>`}function home(){let q=$('search').value.toLowerCase(),items=db.products.filter(p=>p.approved&&p.stock>0&&(category==='Tout'||p.cat===category)&&(mode==='all'||p.type===mode)&&[p.name,p.seller,p.wil].join(' ').toLowerCase().includes(q));return `${notice()}<section class="hero"><div class="muted">🇩🇿 SHOPPING EN DIRECT · الجزائر</div><h1>${tr('Le shopping prend vie.','التسوق يصبح أكثر حيوية')}</h1><p>${tr('Découvre les vendeurs algériens, enchéris et retrouve tes produits préférés.','اكتشف البائعين الجزائريين وتسوق بالمزاد أو بالسعر الثابت.')}</p>${button('Explorer les directs',"go('directs')",'red')} ${button('Devenir vendeur',"go('seller')")}</section><div class="chips">${cats.map((c,i)=>button(esc(c),`setCat(${i})`,category===c?'primary':'')).join('')}</div><div class="tabs">${[['all','Pour toi'],['auction','Enchères'],['fixed','Achat immédiat']].map(x=>button(x[1],`setMode('${x[0]}')`,mode===x[0]?'primary':'')).join('')}</div><h2>À découvrir</h2><div class="grid">${items.map(tile).join('')||'<p>Aucun résultat</p>'}</div><h2>Prochains directs</h2>${showList()}`}function setCat(i){category=cats[i];render()}function setMode(m){mode=m;render()}function showList(){return db.shows.length?db.shows.map(s=>`<div class="card pad line"><b>${esc(s.title)}</b> · ${esc(s.date)} ${button('Me rappeler (local)',`remind(${s.id})`)}</div>`).join(''):'<p class="muted">Aucun direct programmé dans cette démo.</p>'}function remind(id){if(!db.notifications.includes(id))db.notifications.push(id);save();toast('Direct ajouté à tes rappels locaux (pas de notification push)')}function liveView(){let p=product(current);if(!p)return '<p>Produit indisponible</p>';let a=auction&&auction.id===p.id?auction:null;return `${notice()}<div class="two" style="margin-top:14px"><div><div class="stage" id="stage"><span class="big">${esc(p.emoji)}</span><span class="tag">DIRECT SIMULÉ</span><span class="timer" id="clock">${a?Math.max(0,Math.ceil((a.end-Date.now())/1000)):15}s</span></div><div class="card pad" style="margin-top:12px"><div class="row spread"><b>${esc(p.seller)} · ${esc(p.wil)}</b>${button(db.follows.includes(p.seller)?'Suivi ✓':'Suivre',`follow(${p.id})`)}</div><h2>${esc(p.name)}</h2><div class="price" id="bidPrice">${money(a?a.bid:p.price)}</div><p class="muted" id="bidState">${a?(a.running?'Offres : '+a.count:'Enchère terminée'):'Prêt pour un test'}</p>${p.type==='auction'?`<div class="row">${button('Démarrer 15 s','startAuction()','primary')}${button('+100 DA','bid(100)','red')}${button('+500 DA','bid(500)','red')}${button('+1 000 DA','bid(1000)','red')}</div>`:button('Acheter maintenant',`add(${p.id});go('cart')`,'primary')}<p class="muted">Les offres sont locales, aucun autre utilisateur ne participe.</p>${button('Caméra locale (test)','previewCamera()')} ${button('Arrêter caméra','stopCamera()')} ${button('Signaler',`report(${p.id})`)}</div></div><div class="stack"><div class="card pad"><h3>Discussion du direct</h3><div class="chat" id="chat">${messages.map(m=>`<p><b>${esc(m.by)}</b> ${esc(m.text)}</p>`).join('')||'<p class="muted">Bienvenue dans le direct de démonstration.</p>'}</div><form class="row" onsubmit="chatSend(event)"><input name="msg" required maxlength="200" placeholder="Écrire un message" style="flex:1;min-width:90px"><button class="primary">Envoyer</button></form></div><div class="card pad"><h3>Cadeau gratuit (test)</h3>${button('Lancer un cadeau','startGift()')}${button(joined?'Inscrit ✓':'Participer','joinGift()')}${button('Clôturer le test','endGift()')}<p class="muted">Simulation sans achat ni lot réel.</p></div><div class="card pad"><h3>Autres articles</h3>${db.products.filter(x=>x.approved&&x.id!==p.id&&x.stock>0).slice(0,4).map(x=>`<div class="line row spread"><span>${esc(x.emoji)} ${esc(x.name)}</span>${button('Voir',`live(${x.id})`)}</div>`).join('')}</div></div></div>`}function startAuction(){let p=product(current);if(p.type!=='auction'||p.stock<1||auction?.running)return;auction={id:p.id,bid:p.price,count:0,end:Date.now()+15000,running:true};clearInterval(interval);interval=setInterval(tick,200);render()}function bid(n){if(!auction?.running||auction.id!==current||Date.now()>=auction.end)return toast('Aucune enchère active');auction.bid+=n;auction.count++;if(auction.end-Date.now()<5000)auction.end=Date.now()+8000;tick()}function tick(){if(!auction?.running)return;let left=Math.max(0,Math.ceil((auction.end-Date.now())/1000));if(page==='live'&&$('clock')){$('clock').textContent=left+'s';$('bidPrice').textContent=money(auction.bid);$('bidState').textContent='Offres : '+auction.count}if(!left){auction.running=false;clearInterval(interval);if(auction.count){add(auction.id,auction.bid);toast('Enchère test remportée — article au panier')}if(page==='live')render()}}function chatSend(e){e.preventDefault();messages.push({by:db.profile?.name||'Invité',text:e.target.msg.value});render();if($('chat'))$('chat').scrollTop=$('chat').scrollHeight}async function previewCamera(){try{stopCamera();camera=await navigator.mediaDevices.getUserMedia({video:true,audio:false});if(page!=='live'){stopCamera();return}attachCamera()}catch{toast('Caméra indisponible : autorisation et HTTPS nécessaires')}}function attachCamera(){if(camera&&$('stage')){let v=document.createElement('video');v.autoplay=true;v.muted=true;v.playsInline=true;v.srcObject=camera;$('stage').prepend(v);$('stage').querySelector('.big').style.display='none'}}function stopCamera(){if(camera)camera.getTracks().forEach(t=>t.stop());camera=null;if($('stage')){$('stage').querySelector('video')?.remove();$('stage').querySelector('.big').style.display=''}}function startGift(){giveaway=true;joined=false;toast('Cadeau test ouvert')}function joinGift(){if(!giveaway)return toast('Aucun cadeau ouvert');joined=true;render()}function endGift(){if(!giveaway)return;toast(joined?'Participant test sélectionné':'Aucun participant');giveaway=false;joined=false;render()}
function add(id,price){let p=product(id);if(!p||!p.approved||p.stock<1)return toast('Indisponible');if(p.type==='auction'&&price===undefined)return toast('Remporte une enchère avant achat');let qty=db.cart.filter(c=>c.id===id).length;if(qty>=p.stock)return toast('Stock maximum atteint');db.cart.push({id,price:price??p.price});save();$('cartCount').textContent=db.cart.length;toast('Ajouté au panier')}function remove(i){db.cart.splice(i,1);save();render()}function cart(){let subtotal=db.cart.reduce((s,c)=>s+c.price,0);return `<h1>Panier</h1>${notice()}<div class="card pad">${db.cart.map((c,i)=>`<div class="line row spread"><span>${esc(product(c.id)?.name)} — ${money(c.price)}</span>${button('Retirer',`remove(${i})`)}</div>`).join('')||'<p>Ton panier est vide.</p>'}<h3>Sous-total : ${money(subtotal)}</h3>${db.cart.length?button('Commander (simulation)','checkout()','primary'):''}</div>`}const wilayas=['Adrar','Chlef','Laghouat','Oum El Bouaghi','Batna','Béjaïa','Biskra','Béchar','Blida','Bouira','Tamanrasset','Tébessa','Tlemcen','Tiaret','Tizi Ouzou','Alger','Djelfa','Jijel','Sétif','Saïda','Skikda','Sidi Bel Abbès','Annaba','Guelma','Constantine','Médéa','Mostaganem','M’Sila','Mascara','Ouargla','Oran','El Bayadh','Illizi','Bordj Bou Arréridj','Boumerdès','El Tarf','Tindouf','Tissemsilt','El Oued','Khenchela','Souk Ahras','Tipaza','Mila','Aïn Defla','Naâma','Aïn Témouchent','Ghardaïa','Relizane','Timimoun','Bordj Badji Mokhtar','Ouled Djellal','Béni Abbès','In Salah','In Guezzam','Touggourt','Djanet','El M’Ghair','El Meniaa'];function opts(arr){return arr.map(x=>`<option>${esc(x)}</option>`).join('')}function checkout(){let sub=db.cart.reduce((a,c)=>a+c.price,0);modal(`<h2>Commande de démonstration</h2><p class="notice">Utilise uniquement des informations fictives. Aucun paiement ni expédition.</p><form class="form" onsubmit="finishOrder(event)"><label>Nom fictif<input name="name" required value="Client Démo"></label><label>Wilaya<select name="wil" onchange="updateTotal(this.value)">${opts(wilayas)}</select></label><label>Adresse fictive<input name="address" required value="Adresse test"></label><label>Mode de paiement<select name="payment"><option>Paiement à la livraison (test)</option><option>CIB (simulation)</option><option>Edahabia (simulation)</option></select></label><p id="total">${money(sub+shipping(wilayas[0]))} livraison comprise</p><button class="primary">Confirmer la commande test</button><button type="button" onclick="closeModal()">Annuler</button></form>`)}function shipping(w){return [...new Set(db.cart.map(c=>product(c.id)?.seller))].length*(w==='Alger'?500:800)}function updateTotal(w){$('total').textContent=money(db.cart.reduce((a,c)=>a+c.price,0)+shipping(w))+' livraison comprise (tarif fictif)'}function finishOrder(e){e.preventDefault();let f=new FormData(e.target);let groups={};for(let c of db.cart){let p=product(c.id);if(!p||!p.approved||p.stock<db.cart.filter(x=>x.id===c.id).length)return toast('Stock modifié');(groups[p.seller]??=[]).push({...c,name:p.name})}for(let [seller,items] of Object.entries(groups)){let subtotal=items.reduce((a,c)=>a+c.price,0);db.orders.unshift({id:Date.now()+Math.random(),seller,items,subtotal,fee:f.get('wil')==='Alger'?500:800,wil:f.get('wil'),payment:f.get('payment'),status:'Confirmée',commission:db.commission});items.forEach(c=>product(c.id).stock--)}db.cart=[];save();closeModal();go('orders');toast('Commande fictive enregistrée')}function orders(){return `<h1>Mes achats</h1>${notice()}${db.orders.map((o,i)=>`<div class="card pad" style="margin-top:12px"><div class="row spread"><b>Commande #${String(o.id).slice(-6)}</b><b>${esc(o.status)}</b></div><p>${esc(o.seller)} · ${esc(o.wil)} · ${esc(o.payment)}</p>${o.items.map(c=>`<div class="line">${esc(c.name)} — ${money(c.price)}</div>`).join('')}<p>Total : <b>${money(o.subtotal+o.fee)}</b></p>${button('Suivi',`track(${i})`)} ${button('Assistance',`dispute(${i})`)} ${o.status==='Livrée'?button('Évaluer',`review(${i})`):''}</div>`).join('')||'<p>Aucune commande pour le moment.</p>'}`}function track(i){let o=db.orders[i];modal(`<h2>Suivi de commande</h2><p>${esc(o.status)} — statut local, sans transporteur connecté.</p><p>Destination : ${esc(o.wil)}</p>${button('Fermer','closeModal()')}`)}function dispute(i){modal(`<h2>Assistance / litige</h2><form class="form" onsubmit="submitReport(event,'Commande ${i+1}')"><textarea name="reason" required placeholder="Décrire le problème fictif"></textarea><button class="primary">Envoyer le signalement local</button></form>`)}function report(id){modal(`<h2>Signaler un article</h2><form class="form" onsubmit="submitReport(event,'Produit ${id}')"><textarea name="reason" required></textarea><button class="primary">Envoyer</button></form>`)}function submitReport(e,target){e.preventDefault();db.reports.push({target,reason:new FormData(e.target).get('reason'),status:'Ouvert'});save();closeModal();toast('Signalement local enregistré')}function review(i){modal(`<h2>Évaluer la commande</h2><form class="form" onsubmit="submitReview(event,${i})"><select name="rating">${opts([5,4,3,2,1])}</select><textarea name="comment" required></textarea><button class="primary">Publier localement</button></form>`)}function submitReview(e,i){e.preventDefault();let f=new FormData(e.target);db.reviews=db.reviews.filter(r=>r.order!==db.orders[i].id);db.reviews.push({order:db.orders[i].id,seller:db.orders[i].seller,rating:+f.get('rating'),comment:f.get('comment')});save();closeModal();toast('Avis local enregistré')}function profile(){return `<h1>Mon profil</h1>${notice()}<div class="card pad"><form class="form" onsubmit="register(event)"><label>Pseudo fictif<input name="name" required value="${esc(db.profile?.name||'')}"></label><label>Wilaya<select name="wil">${opts(wilayas)}</select></label><button class="primary">Enregistrer le profil local</button></form><p>Pas de connexion sécurisée ni de mot de passe dans cette version.</p>${button('Mes vendeurs suivis',"go('following')")} ${button('Espace vendeur',"go('seller')")} ${button('Administration (démo)',"go('admin')")} ${button('Mes rappels',"go('reminders')")} ${button('Réinitialiser la démo','resetDemo()')}</div>`}function register(e){e.preventDefault();let f=new FormData(e.target);db.profile={name:f.get('name'),wil:f.get('wil')};save();toast('Profil local enregistré');render()}function seller(){let s=db.sellers[0];if(!s)return `<h1>Devenir vendeur</h1>${notice()}<div class="card pad"><form class="form" onsubmit="applySeller(event)"><label>Nom de boutique fictif<input name="name" required></label><label>Wilaya<select name="wil">${opts(wilayas)}</select></label><label>Type<select name="kind"><option>Professionnel</option><option>Particulier (éligibilité à vérifier)</option></select></label><button class="primary">Déposer une candidature test</button></form></div>`;let products=db.products.filter(p=>p.owner===s.id),orders=db.orders.filter(o=>o.seller===s.name),gross=orders.reduce((a,o)=>a+o.subtotal,0);return `<h1>Studio vendeur</h1>${notice()}<div class="card pad"><h2>${esc(s.name)}</h2><p>Statut : <b>${esc(s.status)}</b> · ${esc(s.wil)}</p>${s.status!=='Approuvé'?'<p>Pour tester, ouvre Administration et approuve la candidature.</p>':''}</div><div class="grid" style="margin:14px 0"><div class="card pad"><div class="muted">Ventes simulées</div><div class="stat">${money(gross)}</div></div><div class="card pad"><div class="muted">Net théorique hors frais</div><div class="stat">${money(orders.reduce((a,o)=>a+o.subtotal*(1-o.commission/100),0))}</div></div><div class="card pad"><div class="muted">Articles</div><div class="stat">${products.length}</div></div></div><div class="row">${button('＋ Ajouter un produit','newProduct()','primary')} ${button('Programmer un direct','newShow()')} ${button('Voir ma boutique',"go('shop')")}</div><h2>Inventaire</h2>${products.map(p=>`<div class="card pad line"><b>${esc(p.name)}</b> · ${money(p.price)} · Stock ${p.stock} · ${p.approved?'Publié':'En attente'} ${button('Modifier',`newProduct(${p.id})`)} ${button('Tester le direct',`live(${p.id})`)}</div>`).join('')||'<p>Aucun produit.</p>'}<h2>Commandes de la boutique</h2>${orders.map(o=>`<div class="card pad line"><b>${money(o.subtotal)}</b> · ${esc(o.status)} ${button('Modifier le statut',`statusOrder(${db.orders.indexOf(o)})`)}</div>`).join('')||'<p>Aucune vente.</p>'}<h2>Directs programmés</h2>${showList()}`}function applySeller(e){e.preventDefault();let f=new FormData(e.target);if(db.products.some(p=>p.seller.toLowerCase()===String(f.get('name')).trim().toLowerCase()))return toast('Nom de boutique déjà utilisé');db.sellers.push({id:Date.now(),name:String(f.get('name')).trim(),wil:f.get('wil'),kind:f.get('kind'),status:'En attente'});save();render()}function newProduct(id){let s=db.sellers[0],p=id?product(id):null;if(s.status!=='Approuvé')return toast('Candidature à approuver dans Administration');modal(`<h2>${p?'Modifier':'Ajouter'} un article</h2><form class="form" onsubmit="saveProduct(event,${id||0})"><label>Nom<input name="name" required value="${esc(p?.name||'')}"></label><label>Catégorie<select name="cat">${opts(cats.slice(1))}</select></label><label>Type de vente<select name="type"><option value="auction">Enchères</option><option value="fixed">Prix fixe</option></select></label><label>Prix en DA<input type="number" name="price" required min="1" max="100000000" value="${p?.price||1000}"></label><label>Stock<input type="number" name="stock" required min="0" max="10000" value="${p?.stock??1}"></label><label>Description<textarea name="description">${esc(p?.description||'')}</textarea></label><button class="primary">Soumettre à validation</button></form>`);if(p){$('modal').querySelector('[name=cat]').value=p.cat;$('modal').querySelector('[name=type]').value=p.type}}function saveProduct(e,id){e.preventDefault();let f=new FormData(e.target),s=db.sellers[0],p={id:id||Date.now(),owner:s.id,seller:s.name,wil:s.wil,name:f.get('name'),cat:f.get('cat'),type:f.get('type'),price:+f.get('price'),stock:+f.get('stock'),description:f.get('description'),emoji:'📦',approved:false};if(id)db.products=db.products.map(x=>x.id===id?p:x);else db.products.push(p);save();closeModal();render()}function newShow(){if(db.sellers[0].status!=='Approuvé')return toast('Candidature à approuver');modal(`<h2>Programmer un direct</h2><form class="form" onsubmit="saveShow(event)"><label>Titre<input required name="title"></label><label>Date et heure locale<input type="datetime-local" required name="date"></label><button class="primary">Programmer (local)</button></form>`)}function saveShow(e){e.preventDefault();let f=new FormData(e.target);db.shows.push({id:Date.now(),title:f.get('title'),date:f.get('date'),seller:db.sellers[0].name});save();closeModal();render()}function statusOrder(i){modal(`<h2>Statut de livraison (test)</h2><form class="form" onsubmit="saveStatus(event,${i})"><select name="status">${opts(['Confirmée','Préparation','Expédiée','Livrée'])}</select><button class="primary">Mettre à jour</button></form>`)}function saveStatus(e,i){e.preventDefault();db.orders[i].status=new FormData(e.target).get('status');save();closeModal();render()}function admin(){let gross=db.orders.reduce((a,o)=>a+o.subtotal,0),fee=db.orders.reduce((a,o)=>a+o.subtotal*o.commission/100,0);return `<h1>Administration MAZAD</h1><div class="notice">Accès libre uniquement pour tester les rôles. À protéger sur le futur serveur.</div><div class="grid" style="margin:14px 0"><div class="card pad">Volume de ventes<div class="stat">${money(gross)}</div></div><div class="card pad">Commissions théoriques<div class="stat">${money(fee)}</div></div><div class="card pad">Commandes<div class="stat">${db.orders.length}</div></div></div><div class="card pad"><form class="row" onsubmit="setCommission(event)"><label>Commission test (%) <input name="rate" type="number" min="0" max="30" required value="${db.commission}" style="width:85px"></label><button class="primary">Enregistrer</button></form></div><h2>Candidatures vendeurs</h2>${db.sellers.map((s,i)=>`<div class="card pad line"><b>${esc(s.name)}</b> · ${esc(s.status)} ${button('Approuver',`approveSeller(${i})`)} ${button('Refuser',`rejectSeller(${i})`)}</div>`).join('')||'<p>Aucune candidature.</p>'}<h2>Modération des produits</h2>${db.products.map(p=>`<div class="card pad line"><b>${esc(p.name)}</b> · ${p.approved?'Publié':'Non publié'} ${button(p.approved?'Retirer':'Publier',`approveProduct(${p.id})`)}</div>`).join('')}<h2>Litiges et signalements</h2>${db.reports.map((r,i)=>`<div class="card pad line"><b>${esc(r.target)} · ${esc(r.status)}</b><p>${esc(r.reason)}</p>${button('Clôturer',`resolve(${i})`)}</div>`).join('')||'<p>Aucun signalement.</p>'}<h2>Commandes</h2>${db.orders.map((o,i)=>`<div class="card pad line">${esc(o.seller)} · ${money(o.subtotal)} · ${esc(o.status)} ${button('Suivi',`statusOrder(${i})`)}</div>`).join('')||'<p>Aucune commande.</p>'}`}function setCommission(e){e.preventDefault();db.commission=+new FormData(e.target).get('rate');save();render()}function approveSeller(i){db.sellers[i].status='Approuvé';save();render()}function rejectSeller(i){let s=db.sellers[i];s.status='Refusé';db.products.filter(p=>p.owner===s.id).forEach(p=>p.approved=false);save();render()}function approveProduct(id){let p=product(id);if(!p.approved&&p.owner&&db.sellers.find(s=>s.id===p.owner)?.status!=='Approuvé')return toast('Vendeur non approuvé');p.approved=!p.approved;save();render()}function resolve(i){db.reports[i].status='Clôturé';save();render()}function resetDemo(){if(confirm('Effacer toutes les données de démonstration ?')){localStorage.removeItem('mazad3');location.reload()}}function listing(title,ps){return `<h1>${title}</h1>${notice()}<div class="grid" style="margin-top:15px">${ps.map(tile).join('')||'<p>Rien à afficher.</p>'}</div>`}function render(){let content;switch(page){case 'home':content=home();break;case 'directs':content=listing('Directs et enchères de démonstration',db.products.filter(p=>p.approved&&p.stock>0))+ '<h2>À venir</h2>'+showList();break;case 'live':content=liveView();break;case 'favorites':content=listing('Mes favoris',db.products.filter(p=>db.favorites.includes(p.id)&&p.approved));break;case 'following':content=listing('Vendeurs suivis',db.products.filter(p=>db.follows.includes(p.seller)&&p.approved));break;case 'shop':content=listing('Ma boutique',db.products.filter(p=>p.owner===db.sellers[0]?.id&&p.approved));break;case 'reminders':content='<h1>Rappels enregistrés</h1>'+db.shows.filter(s=>db.notifications.includes(s.id)).map(s=>`<p>${esc(s.title)} — ${esc(s.date)}</p>`).join('');break;case 'cart':content=cart();break;case 'orders':content=orders();break;case 'profile':content=profile();break;case 'seller':content=seller();break;case 'admin':content=admin();break;default:content=home()}$('main').innerHTML=content;$('cartCount').textContent=db.cart.length;$('nav').innerHTML=[['home','⌂',tr('Accueil','الرئيسية')],['directs','◉',tr('Directs','مباشر')],['favorites','♡',tr('Favoris','المفضلة')],['orders','▣',tr('Achats','مشترياتي')],['profile','♙',tr('Profil','حسابي')]].map(([p,i,n])=>button(`<span>${i}</span>${n}`,`go('${p}')`,page===p?'active':'')).join('');if(page==='live')attachCamera()}render();
</script></body></html>
